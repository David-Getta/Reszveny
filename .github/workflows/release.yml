name: Release

# Letölthető kiadás: ha a `pubspec.yaml` verziója változik (vagy egy `v*` tag
# kerül fel), megépíti az Android APK-t, a Windows és a macOS asztali appot és
# a webes változatot, majd GitHub Release-be teszi őket `v<verzió>` taggel.
# Ha az adott verzióhoz már van kiadás, nem csinál semmit.
#
# Kulcsok nem kerülnek a buildbe. Ha a repó „BACKEND_URL” változója
# (Settings → Secrets and variables → Actions → Variables) be van állítva, az
# app a backenden át dolgozik; különben demó módban indul.

on:
  push:
    tags: ['v*']
    branches: ['main', 'claude/**']
    paths: ['pubspec.yaml']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  DEFINES: --dart-define=BACKEND_URL=${{ vars.BACKEND_URL }}
  # Obfuszkált Dart-kód: a kiadott appból jóval nehezebb visszafejteni a
  # működést (a hibakereső szimbólumok a build/symbols mappába kerülnek, nem az appba).
  OBFUSCATE: --obfuscate --split-debug-info=build/symbols

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]*).*/\1/')
          tag="v$ver"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Állandó aláíró kulcs a titkokból, hogy az új verzió a régi fölé
      # települjön. Ha a titok nincs megadva, a debug kulccsal írunk alá (akkor
      # minden kiadás más kulcsot kap, és a telefonon törölni kell a régit).
      - name: Aláíró kulcs
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/whatstock.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/whatstock.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Nincs ANDROID_KEYSTORE_BASE64 titok: debug kulccsal írunk alá."
          fi
      # Univerzális APK (minden processzorra) és egy kisebb, csak arm64-es
      # (szinte minden mai telefon) változat.
      - run: flutter build apk --release ${{ env.DEFINES }} ${{ env.OBFUSCATE }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk WhatStock-android.apk
      - run: flutter build apk --release --split-per-abi ${{ env.DEFINES }} ${{ env.OBFUSCATE }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk WhatStock-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            WhatStock-android.apk
            WhatStock-android-arm64.apk

  windows:
    name: Windows
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release ${{ env.DEFINES }} ${{ env.OBFUSCATE }}
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath WhatStock-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: WhatStock-windows-x64.zip

  macos:
    name: macOS
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release ${{ env.DEFINES }} ${{ env.OBFUSCATE }}
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/WhatStock.app WhatStock-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: WhatStock-macos.zip

  web:
    name: Web
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn ${{ env.DEFINES }}
      - run: cd build/web && zip -qr ../../WhatStock-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: WhatStock-web.zip

  release:
    name: GitHub Release
    needs: [version, android, windows, macos, web]
    # Akkor is kiadás készül, ha valamelyik platform buildje elmaradt (pl. a macOS
    # futtató nem vette fel a munkát): a kész fájlok felkerülnek, a hiányzó
    # platform a sikertelen jobok újrafuttatásával („Re-run failed jobs”) pótolható,
    # a kiadás ugyanazzal a taggel bővül.
    if: ${{ always() && needs.version.result == 'success' && needs.version.outputs.exists != 'true' && (needs.android.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success' || needs.web.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: WhatStock ${{ needs.version.outputs.tag }}
          prerelease: true
          files: dist/*
          body: |
            Kipróbálható előzetes kiadás. Kulcs nélkül demó módban fut: AAPL, MSFT, NVDA és OTP mintaadatokkal.

            **Telepítés**
            - **Android:** töltsd le a telefonra a `WhatStock-android-arm64.apk` fájlt (kisebb, szinte minden mai telefonon fut), vagy ha az nem települ, a `WhatStock-android.apk`-t. Nyisd meg, és engedélyezd az ismeretlen forrásból való telepítést.
            - **Windows:** csomagold ki a `WhatStock-windows-x64.zip` fájlt, és indítsd el a `WhatStock.exe`-t. A SmartScreen figyelmeztetésnél válaszd a „További információ”, majd a „Futtatás mindenképp” lehetőséget.
            - **macOS:** csomagold ki a `WhatStock-macos.zip` fájlt, húzd az appot a Programok mappába, majd jobb klikk → Megnyitás (az app nincs aláírva).
            - **Web:** a `WhatStock-web.zip` bármilyen statikus tárhelyre feltölthető.
            - **iOS / iPadOS:** aláírás nélkül nem telepíthető; ehhez Apple fejlesztői fiók és TestFlight kell.

            Ha valamelyik platform fájlja hiányzik, annak a buildje elmaradt (pl. a macOS-futtató nem állt rendelkezésre); a sikertelen jobok újrafuttatása után ide kerül.
