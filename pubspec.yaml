name: reszveny
description: "WhatStock – photograph a stock and learn everything about it. iOS, iPadOS, macOS, Android, Windows."
publish_to: 'none'
version: 0.2.181+184

environment:
  sdk: ^3.13.5

dependencies:
  auto_updater: ^1.0.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hotkey_manager: ^0.2.3
  http: ^1.6.0
  image_picker: ^1.2.4
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  in_app_update: ^5.0.0
  intl: ^0.20.3
  launch_at_startup: ^0.5.1
  local_notifier: ^0.1.6
  package_info_plus: ^9.0.1
  pasteboard: ^0.5.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.6
  tray_manager: ^0.5.0
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/branding/logo_128.png
    - assets/branding/logo_256.png

flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/branding/app_icon.png
  image_path_ios: assets/branding/app_icon_ios.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/branding/app_icon.png
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256

# Microsoft Store csomag (MSIX): `dart run msix:create --store` a Windows build után.
# Az identity_name és a publisher a Partner Centerből jön (tulajdonosi adat); addig a
# helyi próbacsomaghoz a `dart run msix:create` saját tesztaláírást készít. A csomag
# verziója a `version:` mezőből jön; a nyelvek az app nyelvei közül a Microsoft Store által támogatottak.
msix_config:
  display_name: WhatStock
  publisher_display_name: WhatStock
  identity_name: WhatStock.WhatStock
  logo_path: assets/branding/app_icon.png
  capabilities: internetClient
  languages: af, am, ar, as, az, be, bg, bn, bs, ca, ckb, cs, da, de, el, en, es, fa, fi, fil, fr, gl, gu, ha, he, hi, hr, hu, hy, id, ig, it, ja, ka, kk, km, kn, ko, ky, lo, lt, lv, mk, ml, mn, mr, ms, nb, ne, nl, nso, or, pa, pl, pt, qu, ro, ru, rw, sd, si, sk, sl, sq, sr, sv, sw, ta, te, tg, th, ti, tk, tn, tr, tt, ug, uk, ur, uz, vi, wo, xh, yo, zh, zh-Hant, zu
  store: true

