name: reszveny
description: "StockLens – photograph a stock and learn everything about it. iOS, iPadOS, macOS, Android, Windows."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hotkey_manager: ^0.2.3
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  launch_at_startup: ^0.5.1
  pasteboard: ^0.5.0
  shared_preferences: ^2.5.6
  tray_manager: ^0.5.0
  url_launcher: ^6.3.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/branding/logo_128.png
    - assets/branding/logo_256.png

flutter_launcher_icons:
  image_path: assets/branding/app_icon.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/branding/app_icon.png
  image_path_ios: assets/branding/app_icon_ios.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/branding/app_icon.png
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256
